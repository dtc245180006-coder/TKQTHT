global:
  resolve_timeout: 2m
route:
  receiver: local-inbox
  group_by: [alertname, service, job, filesystem]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h
receivers:
  - name: local-inbox
    webhook_configs:
      - url: http://operations:9094/webhook
        send_resolved: true
        max_alerts: 100
