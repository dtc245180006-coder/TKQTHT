# Ubuntu/LAN installation with an IP-based self-signed TLS certificate.
# Requires Docker Compose v2.24.4+ for !override.
services:
  backend:
    environment:
      SESSION_COOKIE_SECURE: "true"
      REQUIRE_HTTPS: "true"

  nginx:
    ports: !override
      - "8000:8080"
      - "8443:8443"
    volumes: !override
      - ./nginx/self-signed.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/local/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/local/server.key:/etc/nginx/certs/server.key:ro
