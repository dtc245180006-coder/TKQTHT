limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
log_format hotel_safe escape=json '{"event":"proxy","method":"$request_method","status":$status,"duration":"$request_time"}';

upstream hotel_backend {
    zone hotel_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server backend:5000 resolve;
    keepalive 32;
    keepalive_timeout 5s;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host:8443$request_uri;
}

server {
    access_log /dev/stdout hotel_safe;
    error_log /dev/null crit;
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://images.unsplash.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /metrics { return 404; }
    location ^~ /metrics/ { return 404; }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
